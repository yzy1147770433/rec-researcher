[project]
name = "rec-researcher"
version = "0.1.0"
description = "Offline-testable research workflow for recommender-system questions"
readme = "README.md"
authors = [
    { name = "yzy1147770433", email = "yzy1147770433@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "orjson>=3.11.9",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pymilvus[milvus-lite]>=3.0.0",
    "rank-bm25>=0.2.2",
    "rich>=15.0.0",
    "tenacity>=9.1.4",
    "trafilatura>=2.1.0",
    "typer>=0.27.0",
]

[project.scripts]
rec-researcher = "rec_researcher.cli:app"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -m 'not network'"
testpaths = ["tests"]
markers = [
    "network: tests that require network access and credentials",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
